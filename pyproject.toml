[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sip-mqtt-client"
version = "0.1.0"
description = "SIP client with MQTT integration for call monitoring and control"
readme = "README.md"
license = { text = "Beer-Ware" }
requires-python = ">=3.8"
dependencies = [
    "paho-mqtt>=1.6.1",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.scripts]
sip-mqtt-client = "main:main"

[tool.setuptools.packages.find]
where = ["."]
